<text x="76" y="550" fill="#AB6835" font-size="27" font-weight="700" text-anchor="start">1.99배의 처리 시간</text>
<rect x="636" y="153" width="516" height="438" fill="#FFFFFF" rx="20" stroke="#DDDDE0" stroke-width="1"/>
<text x="661" y="199" fill="#193354" font-size="28" font-weight="700" text-anchor="start">근거 없는 질문의 오답</text>
<text x="661" y="233" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">별도 합성 80문항 / 단위 건</text>
