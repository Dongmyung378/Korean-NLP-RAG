<text x="664" y="550" fill="#AB6835" font-size="27" font-weight="700" text-anchor="start">잘못된 답변 3건 증가</text>
<text x="48" y="650" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">GPU 처리 시간은 모델 로딩을 제외합니다. 사용자 CPU의 실행 시간과 구분합니다.</text>
<text x="48" y="679" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">합성 무응답 문항은 통제 표본이며 실제 모든 질문의 오류율로 일반화할 수 없습니다.</text>
