<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">답변 개선과 함께 증가한 실행 비용과 잘못된 답변</title>
<desc id="desc">같은 GPU 실행 경로의 전체581문항 평균 처리 시간이 증가했고 별도 합성 무응답80문항의 잘못된 답변도1개에서4개로 증가했습니다. 두 패널의 단위와 분모는 다릅니다.</desc>
<style>text{font-family:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;font-variant-numeric:tabular-nums} .axis{fill:#64696B}</style>
<rect x="0" y="0" width="1200" height="710" fill="#F6F7F9" rx="0" stroke-width="1"/>
<text x="48" y="64" fill="#193354" font-size="36" font-weight="750" text-anchor="start">답변 개선에 따른 실행 비용과 오답 변화</text>
<text x="48" y="104" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">정답은 늘었지만 처리 시간과 근거 없는 질문의 잘못된 답변도 증가했습니다.</text>
